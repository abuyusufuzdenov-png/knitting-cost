<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Себестоимость" />
  <title>Конструктор себестоимости — Вязальный цех 2025</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 84px;
    }
    header {
      position: sticky; top: 0; z-index: 30;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .fx-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--primary-soft); color: var(--primary);
      padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 600;
    }
    .fx-pill input {
      width: 58px; border: 1px solid #bfdbfe; border-radius: 6px;
      padding: 3px 6px; font-weight: 700; color: var(--text); text-align: center;
    }
    .desktop-nav {
      display: flex; gap: 6px; padding: 10px 16px 0; max-width: 1280px; margin: 0 auto;
      overflow-x: auto;
    }
    .tab-btn {
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: .15s;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    main { max-width: 1280px; margin: 0 auto; padding: 14px 16px; }
    .grid-calc { display: grid; grid-template-columns: 310px 1fr; gap: 16px; align-items: start; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 15px; font-weight: 700; margin: 0 0 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border); background: #fff; color: var(--text);
      padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: .15s;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-soft { background: var(--primary-soft); color: var(--primary); border-color: #dbeafe; }
    .btn-danger { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
    .btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
    input, select {
      font: inherit; font-size: 14px; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid #93c5fd; border-color: var(--primary); }
    .model-list { max-height: 68vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .model-item {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: #fff; transition: .12s;
    }
    .model-item:hover { border-color: #93c5fd; }
    .model-item.active { background: var(--primary-soft); border-color: var(--primary); }
    .model-name { font-weight: 600; font-size: 13.5px; }
    .model-cat { font-size: 11.5px; color: var(--muted); }
    .model-price { font-weight: 700; font-size: 14px; color: var(--primary); white-space: nowrap; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; box-shadow: var(--shadow);
    }
    .kpi.highlight { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; }
    .kpi-label { font-size: 11.5px; opacity: .8; margin-bottom: 4px; }
    .kpi-val { font-size: 20px; font-weight: 800; }
    .kpi-sub { font-size: 11.5px; opacity: .85; margin-top: 2px; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .field input, .field select { width: 100%; }
    .line-row {
      display: grid; grid-template-columns: 1fr 110px 95px 34px; gap: 8px;
      align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--border);
    }
    .line-row:last-child { border-bottom: none; }
    .sum-cell { font-weight: 700; text-align: right; font-size: 13.5px; white-space: nowrap; }
    .quick-add {
      margin-top: 10px; padding: 10px; background: #f8fafc; border: 1px dashed #cbd5e1;
      border-radius: 10px; display: none; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .quick-add.open { display: flex; }
    .bar-wrap { height: 14px; border-radius: 99px; overflow: hidden; display: flex; background: #e2e8f0; margin: 10px 0 8px; }
    .bar-seg { height: 100%; transition: width .25s; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { font-size: 12px; color: var(--muted); font-weight: 700; background: #f8fafc; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .table-wrap { overflow-x: auto; }
    .bottom-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      grid-template-columns: repeat(4, 1fr); gap: 4px;
    }
    .bottom-nav button {
      border: none; background: transparent; color: var(--muted);
      font-size: 11px; font-weight: 600; padding: 6px 4px; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    }
    .bottom-nav button.active { color: var(--primary); background: var(--primary-soft); }
    .bottom-nav .ico { font-size: 18px; line-height: 1; }
    .pin-overlay {
      position: fixed; inset: 0; z-index: 100; background: #0f172a;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .pin-overlay.open { display: flex; }
    .pin-box {
      background: #fff; padding: 26px; border-radius: 18px; width: 100%; max-width: 340px;
      text-align: center;
    }
    .toast {
      position: fixed; top: 70px; right: 16px; z-index: 90;
      background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s;
    }
    .toast.show { opacity: 1; }
    .grid-calc > *, .kpi, .field { min-width: 0; }
    .model-filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 120px); gap: 6px; margin-bottom: 10px; }
    .model-filters > *, .line-row > select, .line-row > input { min-width: 0; width: 100%; }
    .model-item > :first-child { min-width: 0; overflow-wrap: anywhere; }
    .model-price { flex-shrink: 0; }
    @media (max-width: 860px) {
      html { scroll-padding-top: 76px; scroll-padding-bottom: 84px; }
      body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
      header { padding: 8px 12px; gap: 8px; }
      main { padding: 12px; }
      .grid-calc { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .card { padding: 12px; }
      .card-title { flex-wrap: wrap; }
      .btn, input:not([type="checkbox"]):not([type="range"]), select { min-height: 44px; }
      input, select { max-width: 100%; font-size: 16px; }
      .fx-pill { padding: 2px 6px; }
      .fx-pill input { width: 54px; }
      .model-list { max-height: min(28vh, 210px); }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .kpi { overflow-wrap: anywhere; }
      .kpi.highlight { grid-column: 1 / -1; }
      .kpi.highlight .kpi-val { font-size: 26px; }
      .form-row { grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); }
      .line-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 6px; padding: 10px 0; }
      .line-row > select { grid-column: 1 / -1; }
      .sum-cell { white-space: normal; overflow-wrap: anywhere; }
      .desktop-nav { display: none; }
      .bottom-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .bottom-nav button { min-height: 48px; }
      .table-wrap table, .table-wrap tbody { display: block; }
      .table-wrap thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .table-wrap tbody tr {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px;
        align-items: end; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--border);
      }
      .table-wrap td { min-width: 0; padding: 0; border: 0; overflow-wrap: anywhere; }
      .table-wrap td:first-child { grid-column: 1 / -1; }
      .table-wrap td > input, .table-wrap td > select { width: 100% !important; }
      .table-wrap td[data-label]::before {
        content: attr(data-label); display: block; color: var(--muted); font-size: 11px; font-weight: 600;
      }
      .summary-table tbody tr { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .summary-table .num { text-align: left; }
      .summary-table td:last-child { font-weight: 800; color: var(--primary); }
      .toast { max-width: calc(100% - 32px); }
    }
  </style>
</head>

<div id="pinOverlay" class="pin-overlay">
  <div class="pin-box">
    <h2 style="margin:0 0 8px;">🔒 Вход в цех</h2>

<div id="toast" class="toast"></div>

</header>

  <button class="tab-btn" data-tab="summary" onclick="switchTab('summary')">📊 Сводка и экспорт</button>
</nav>

<main id="app"></main>

  <button data-tab="summary" onclick="switchTab('summary')"><span class="ico">📊</span><span>Сводка</span></button>
</nav>

const DISK_API = 'https://cloud-api.yandex.net/v1/disk/resources';
const DISK_SCOPE = 'cloud_api:disk.app_folder';
const DISK_TOKEN = 'knitting_disk_session';
const DISK_NONCE = 'knitting_disk_nonce';
const DISK_BASE = 'knitting_disk_base';

let diskBusy = false;

let diskStatus = '';

function connectDisk() {
  const nonce = crypto.randomUUID();
  sessionStorage.setItem(DISK_NONCE, nonce);
  const query = new URLSearchParams({
    response_type: 'token', client_id: DISK_CLIENT_ID,
    redirect_uri: DISK_REDIRECT, state: nonce, scope: DISK_SCOPE
  });
  location.assign('https://oauth.yandex.ru/authorize?' + query);
}

function receiveDiskLogin() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (!params.has('access_token') && !params.has('error')) return;
  history.replaceState(null, '', location.pathname + location.search);
  const expected = sessionStorage.getItem(DISK_NONCE);
  sessionStorage.removeItem(DISK_NONCE);
  if (!expected || expected !== params.get('state') || !params.get('access_token')) {
    diskStatus = 'Вход не подтверждён. Подключите Яндекс Диск ещё раз.';
    return;
  }
  sessionStorage.setItem(DISK_TOKEN, params.get('access_token'));
  diskStatus = 'Диск подключён. Нажмите «Синхронизировать», чтобы выбрать основную базу.';
  currentTab = 'summary';
  document.querySelectorAll('[data-tab]').forEach(button =>
    button.classList.toggle('active', button.dataset.tab === 'summary'));
}

function diskControls() {
  const connected = Boolean(sessionStorage.getItem(DISK_TOKEN));
  return `
    <section class="card">
      <div class="card-title">Синхронизация с Яндекс Диском</div>
      <p id="diskStatus" role="status">${esc(diskStatus || (connected ? 'Яндекс Диск подключён.' : 'Подключите один и тот же Яндекс ID на ПК и телефоне.'))}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${connected ? '<button class="btn btn-primary" id="diskSync" onclick="syncDisk(true)">Синхронизировать</button><button class="btn" onclick="disconnectDisk()">Отключить</button>' : '<button class="btn btn-primary" onclick="connectDisk()">Подключить Яндекс Диск</button>'}
        ${localStorage.getItem(DISK_BACKUP) ? '<button class="btn" onclick="downloadDiskBackup()">Скачать копию до синхронизации</button>' : ''}
      </div>
    </section>`;
}

function disconnectDisk() {
  sessionStorage.removeItem(DISK_TOKEN);
  clearTimeout(diskTimer);
  diskStatus = 'Яндекс Диск отключён.';
  render();
}

function downloadDiskBackup() {
  const backup = localStorage.getItem(DISK_BACKUP);
  if (backup) downloadBlob(backup, 'knitting_cost_before_sync.json', 'application/json');
}

function setDiskStatus(message) {
  diskStatus = message;
  const label = document.getElementById('diskStatus');
  if (label) label.textContent = message;
}

async function diskRequest(token, endpoint, params) {
  const response = await fetch(DISK_API + endpoint + '?' + new URLSearchParams(params), {
    headers: { Authorization: 'OAuth ' + token },
    cache: 'no-store'
  });
  if (response.status === 401) throw new Error('Срок входа истёк. Отключите Диск и подключите его снова.');
  if (!response.ok) throw new Error('Яндекс Диск вернул ошибку ' + response.status + '.');
  return response.json();
}

async function latestDiskRevision(token) {
  let latest = 0;
  const limit = 100;
  for (let offset = 0; ; offset += limit) {
    const folder = await diskRequest(token, '', { path: 'app:/', limit, offset });
    const items = folder._embedded.items;
    for (const item of items) {
      const match = /^knitting-cost-(\d{10})\.json$/.exec(item.name);
      if (match) latest = Math.max(latest, Number(match[1]));
    }
    if (items.length < limit) return latest;
  }
}

function diskPath(revision) {
  return 'app:/knitting-cost-' + String(revision).padStart(10, '0') + '.json';
}

function diskSnapshot(base) {
  const { pinCode, ...data } = base;
  return JSON.stringify(data);
}

async function readDiskRevision(token, revision) {
  const { href } = await diskRequest(token, '/download', { path: diskPath(revision) });
  const response = await fetch(href, { cache: 'no-store' });
  if (!response.ok) throw new Error('Не удалось прочитать базу на Диске.');
  const data = await response.json();
  if (!['models', 'yarns', 'works', 'materials', 'indirectFixed', 'indirectVar'].every(key => Array.isArray(data[key]))) {
    throw new Error('Файл на Диске имеет неверный формат.');
  }
  return diskSnapshot(data);
}

async function writeDiskRevision(token, revision, snapshot) {
  const { href } = await diskRequest(token, '/upload', { path: diskPath(revision), overwrite: 'false' });
  const response = await fetch(href, { method: 'PUT', body: snapshot });
  if (!response.ok) throw new Error('Не удалось сохранить версию. Проверьте связь и повторите синхронизацию.');
}

function scheduleDiskSync() {
  clearTimeout(diskTimer);
  if (sessionStorage.getItem(DISK_TOKEN) && localStorage.getItem(DISK_BASE)) {
    diskTimer = setTimeout(() => syncDisk(false), 1500);
  }
}

  if (button) button.disabled = true;
  let pendingChanges = false;
  try {
    setDiskStatus('Проверяю версии базы…');
    const local = diskSnapshot(state);
    const base = JSON.parse(localStorage.getItem(DISK_BASE) || 'null');
    const revision = await latestDiskRevision(token);
    const cloud = revision ? await readDiskRevision(token, revision) : null;
    if (sessionStorage.getItem(DISK_TOKEN) !== token) return;
    if (diskSnapshot(state) !== local) {
      pendingChanges = true;
      setDiskStatus('База изменилась во время проверки. Повторяю синхронизацию.');
      return;
    }
    let selected = local;
    if (local !== cloud && (!base || !cloud || (base.snapshot !== local && base.snapshot !== cloud))) {
      if (!manual) {
        setDiskStatus('Нужно выбрать версию базы. Откройте «Сводка» → «Синхронизировать».');
        showToast('Синхронизация ждёт выбора версии');
        return;
      }
      const choice = cloud ? prompt('Копии различаются. Введите 1 — сохранить базу этого устройства на Диск, или 2 — загрузить базу с Диска. Отмена оставит обе копии как есть.') :
        (confirm('На Яндекс Диске пока нет базы. Сохранить туда данные с этого устройства?') ? '1' : null);
      if (choice !== '1' && !(choice === '2' && cloud)) {
        setDiskStatus('Синхронизация отменена.');
        return;
      }
      localStorage.setItem(DISK_BACKUP, JSON.stringify(state));
      if (choice === '2') selected = cloud;
    } else if (base?.snapshot === local && cloud) {
      selected = cloud;
    }

    if (selected !== cloud) await writeDiskRevision(token, revision + 1, selected);
    if (sessionStorage.getItem(DISK_TOKEN) !== token) return;
    pendingChanges = diskSnapshot(state) !== local;
    if (selected !== local && !pendingChanges) {
      localStorage.setItem(DISK_BACKUP, JSON.stringify(state));
      const nextState = { ...JSON.parse(selected), pinCode: state.pinCode };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      state = nextState;
    }
    localStorage.setItem(DISK_BASE, JSON.stringify({ snapshot: selected }));
    setDiskStatus('Синхронизировано · ' + new Date().toLocaleTimeString('ru-RU'));
    if (selected !== local && !pendingChanges) render();
    else if (manual && currentTab === 'summary') render();
  } catch (error) {
    setDiskStatus(error instanceof TypeError ? 'Яндекс Диск недоступен. Локальная база сохранена.' : error.message);
    if (manual) showToast(diskStatus);
  } finally {
    diskBusy = false;
    if (button) button.disabled = false;
    if (pendingChanges) scheduleDiskSync();
  }
}

function refreshDisk() {
  if (localStorage.getItem(DISK_BASE)) syncDisk(false);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.models)) return parsed;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function saveState(msg) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (msg) showToast(msg);
  scheduleDiskSync();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

function fmt(n) {
  return (Number(n) || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmt0(n) {
  return Math.round(Number(n) || 0).toLocaleString('ru-RU');
}
function uid(prefix) {
  return prefix + '_' + Math.random().toString(36).slice(2, 8);
}

function getIndirectPerUnit() {
  const vol = Math.max(1, Number(state.annualVolume) || 1);
  const fixedSum = state.indirectFixed.reduce((s, i) => s + (Number(i.annual) || 0), 0);
  const varSum = state.indirectVar.reduce((s, i) => s + (Number(i.annual) || 0), 0);
  return {
    fixedAnnual: fixedSum,
    varAnnual: varSum,
    fixedUnit: fixedSum / vol,
    varUnit: varSum / vol,
    totalUnit: (fixedSum + varSum) / vol
  };
}

function calcModel(m) {
  const fx = Number(m.fxRate) || Number(state.globalFx) || 82;
  let yarnCost = 0;
  let totalWeight = 0;
  (m.yarns || []).forEach(yRow => {
    const ref = state.yarns.find(y => y.id === yRow.yarnId);
    const w = Number(yRow.weight) || 0;
    totalWeight += w;
    if (!ref) return;
    const priceRub = ref.currency === 'USD' ? (Number(ref.price) || 0) * fx : (Number(ref.price) || 0);
    yarnCost += w * priceRub;
  });

  const defectCost = yarnCost * ((Number(m.defectPct) || 0) / 100);

  let worksCost = 0;
  (m.works || []).forEach(wRow => {
    const ref = state.works.find(w => w.id === wRow.workId);
    if (!ref) return;
    const rate = (wRow.customRate !== undefined && wRow.customRate !== '' && wRow.customRate !== null)
      ? Number(wRow.customRate) : Number(ref.rate) || 0;
    worksCost += ref.type === 'per_min' ? rate * (Number(m.knitTime) || 0) : rate;
  });

  let matsCost = 0;
  (m.materials || []).forEach(mRow => {
    const ref = state.materials.find(x => x.id === mRow.matId);
    if (!ref) return;
    matsCost += (Number(ref.price) || 0) * (Number(mRow.qty) || 0);
  });

  const direct = yarnCost + defectCost + worksCost + matsCost;
  const ind = getIndirectPerUnit();
  const indirectFixed = m.includeIndirect ? ind.fixedUnit : 0;
  const indirectVar = m.includeIndirect ? ind.varUnit : 0;
  const total = direct + indirectFixed + indirectVar;
  const sell = Number(m.sellPrice) || 0;
  const profit = sell > 0 ? sell - total : 0;
  const marginPct = sell > 0 ? (profit / sell) * 100 : 0;

  return { totalWeight, yarnCost, defectCost, worksCost, matsCost, direct, indirectFixed, indirectVar, total, sell, profit, marginPct };
}

function applyGlobalFx(val) {
  const num = parseFloat(val);
  if (!num || num <= 0) return;
  state.globalFx = num;
  state.models.forEach(m => { m.fxRate = num; });
  saveState('Курс $ обновлён для всех моделей');
  render();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
  window.scrollTo(0, 0);
}

function render() {
  document.getElementById('globalFxInput').value = state.globalFx;
  const app = document.getElementById('app');
  if (currentTab === 'calc') app.innerHTML = renderCalcTab();
  else if (currentTab === 'refs') app.innerHTML = renderRefsTab();
  else if (currentTab === 'indirect') app.innerHTML = renderIndirectTab();
  else if (currentTab === 'summary') app.innerHTML = renderSummaryTab();
}

function renderModelList() {
  const filtered = state.models.filter(m => {
    const okCat = catFilter === 'Все' || m.category === catFilter;
    const okQ = !searchQuery || m.name.toLowerCase().includes(searchQuery.toLowerCase());
    return okCat && okQ;
  });

  return  filtered.map(item => {
    const ic = calcModel(item);
    return `
      <div class="model-item ${item.id === selectedModelId ? 'active' : ''}" onclick="selectModel('${item.id}')">
        <div>
          <div class="model-name">${esc(item.name)}</div>
          <div class="model-cat">${esc(item.category)} · ${(ic.totalWeight*1000).toFixed(0)} г · ${item.knitTime} мин</div>
        </div>
        <div class="model-price">${fmt(ic.total)} ₽</div>
      </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:13px;padding:12px;">Ничего не найдено</div>';
}

function filterModels(query) {
  searchQuery = query;
  const list = document.querySelector('.model-list');
  list.innerHTML = renderModelList();
  list.scrollTop = 0;
}

      <td><button class="btn btn-danger btn-sm" onclick="deleteRef('materials', ${i})">✕</button></td>
    </tr>`).join('');

  return `
    <div class="card">
      <div class="card-title">
        <span>🧶 Справочник пряжи</span>
        <button class="btn btn-primary btn-sm" onclick="state.yarns.push({id:uid('y'),name:'Новая пряжа',currency:'RUB',price:800});saveState();render()">+ Добавить</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Название</th><th>Цена</th><th>Валюта</th><th></th></tr></thead><tbody>${yRows}</tbody></table></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>🪡 Справочник работ</span>
        <button class="btn btn-primary btn-sm" onclick="state.works.push({id:uid('w'),name:'Новая операция',type:'fixed',rate:10});saveState();render()">+ Добавить</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Операция</th><th>Ставка</th><th>Тип</th><th></th></tr></thead><tbody>${wRows}</tbody></table></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>📦 Справочник материалов и упаковки</span>
        <button class="btn btn-primary btn-sm" onclick="state.materials.push({id:uid('mat'),name:'Новый материал',unit:'шт',price:5});saveState();render()">+ Добавить</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Материал</th><th>Цена ₽</th><th>Ед.</th><th></th></tr></thead><tbody>${mRows}</tbody></table></div>
    </div>`;
}

function renderIndirectTab() {
  const ind = getIndirectPerUnit();
  const makeRows = (arr, key) => arr.map((item, i) => `
    <tr>
      <td><input value="${esc(item.name)}" onchange="state.${key}[${i}].name=this.value;saveState();render()" style="width:100%;" /></td>
      <td data-label="Сумма в год, ₽"><input type="number" step="1000" value="${item.annual}" onchange="state.${key}[${i}].annual=parseFloat(this.value)||0;saveState();render()" style="width:130px;" /></td>
      <td class="num" data-label="На 1 шт">${fmt(item.annual / Math.max(1, state.annualVolume))} ₽</td>
      <td><button class="btn btn-danger btn-sm" onclick="state.${key}.splice(${i},1);saveState();render()">✕</button></td>
    </tr>`).join('');

  return `
    <div class="kpi-grid">
      <div class="kpi highlight">
        <div class="kpi-label">Косвенные на 1 изделие</div>
        <div class="kpi-val">${fmt(ind.totalUnit)} ₽</div>
        <div class="kpi-sub">При плане ${fmt0(state.annualVolume)} шт/год</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Постоянные / год</div>
        <div class="kpi-val">${fmt0(ind.fixedAnnual)} ₽</div>
        <div class="kpi-sub">${fmt(ind.fixedUnit)} ₽ / шт</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Переменные / год</div>
        <div class="kpi-val">${fmt0(ind.varAnnual)} ₽</div>
        <div class="kpi-sub">${fmt(ind.varUnit)} ₽ / шт</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Всего накладных / год</div>
        <div class="kpi-val">${fmt0(ind.fixedAnnual + ind.varAnnual)} ₽</div>
        <div class="kpi-sub">База 2025 года</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>📈 Плановый объём выпуска (шт / год)</span></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <input type="range" min="10000" max="150000" step="1000" value="${state.annualVolume}" oninput="state.annualVolume=parseInt(this.value);saveState();render()" style="flex:1;min-width:200px;" />
        <input type="number" step="1000" min="100" value="${state.annualVolume}" onchange="state.annualVolume=parseInt(this.value)||72022;saveState();render()" style="width:130px;font-weight:700;" />
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Косвенно-постоянные расходы (₽/год)</span>
        <button class="btn btn-sm" onclick="state.indirectFixed.push({id:uid('if'),name:'Новая статья',annual:0});saveState();render()">+ Статья</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Статья</th><th>Сумма в год, ₽</th><th class="num">На 1 шт</th><th></th></tr></thead><tbody>${makeRows(state.indirectFixed, 'indirectFixed')}</tbody></table></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Косвенно-переменные расходы (₽/год)</span>
        <button class="btn btn-sm" onclick="state.indirectVar.push({id:uid('iv'),name:'Новая статья',annual:0});saveState();render()">+ Статья</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Статья</th><th>Сумма в год, ₽</th><th class="num">На 1 шт</th><th></th></tr></thead><tbody>${makeRows(state.indirectVar, 'indirectVar')}</tbody></table></div>
    </div>`;
}

function renderSummaryTab() {
  const rowsHtml = state.models.map(m => {
    const c = calcModel(m);
    return `
      <tr style="cursor:pointer;" onclick="selectedModelId='${m.id}';switchTab('calc')">
        <td><b>${esc(m.name)}</b><div style="font-size:11.5px;color:var(--muted);">${esc(m.category)}</div></td>
        <td class="num" data-label="Вес">${(c.totalWeight*1000).toFixed(0)} г</td>
        <td class="num" data-label="Пряжа и брак">${fmt(c.yarnCost + c.defectCost)} ₽</td>
        <td class="num" data-label="Работы">${fmt(c.worksCost)} ₽</td>
        <td class="num" data-label="Материалы">${fmt(c.matsCost)} ₽</td>
        <td class="num" data-label="Прямые">${fmt(c.direct)} ₽</td>
        <td class="num" data-label="Косвенные">${fmt(c.indirectFixed + c.indirectVar)} ₽</td>
        <td class="num" data-label="Итого"><b>${fmt(c.total)} ₽</b></td>
      </tr>`;
  }).join('');

  return `
    ${diskControls()}
    <div class="card">
      <div class="card-title">
        <span>📊 Сводная таблица себестоимости (${state.models.length} моделей)</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" onclick="exportCSV()">📥 Экспорт CSV (Excel)</button>
          <button class="btn btn-sm" onclick="exportJSON()">💾 Скачать базу JSON</button>
          <label class="btn btn-sm" style="cursor:pointer;">
            📂 Загрузить JSON
            <input type="file" accept=".json" style="display:none;" onchange="importJSON(this)" />
          </label>
        </div>
      </div>
      <div class="table-wrap summary-table">
        <table>
          <thead>
            <tr>
              <th>Модель</th><th class="num">Вес</th><th class="num">Пряжа+брак</th>
              <th class="num">Работы</th><th class="num">Материалы</th><th class="num">Прямые</th>
              <th class="num">Косвенные</th><th class="num">Итого</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>🔒 Защита PIN-кодом и сброс данных</span></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <input id="newPinInput" type="password" inputmode="numeric" placeholder="Задайте PIN (пусто = без PIN)" value="${esc(state.pinCode || '')}" style="width:230px;" />
        <button class="btn btn-soft btn-sm" onclick="savePin()">Сохранить PIN</button>
        <button class="btn btn-danger btn-sm" style="margin-left:auto;" onclick="resetAll()">↺ Сбросить к таблице 2025</button>
      </div>
    </div>`;
}

// Model actions
function selectModel(id) {
  selectedModelId = id;
  render();
  if (window.matchMedia('(max-width: 860px)').matches) {
    document.getElementById('modelEditor').scrollIntoView({ block: 'start' });
  }
}
function currentModel() { return state.models.find(m => m.id === selectedModelId); }
function updateModelField(field, val) {
  const m = currentModel(); if (!m) return;
  m[field] = val; saveState(); render();
}
function addModelYarn() {
  const m = currentModel(); if (!m || !state.yarns.length) return;
  m.yarns.push({ yarnId: state.yarns[0].id, weight: 0.1 }); saveState(); render();
}
function updateModelYarn(idx, field, val) {
  const m = currentModel(); if (!m) return;
  m.yarns[idx][field] = field === 'weight' ? (parseFloat(val) || 0) : val; saveState(); render();
}
function removeModelYarn(idx) {
  const m = currentModel(); if (!m) return;
  m.yarns.splice(idx, 1); saveState(); render();
}
function addModelWork() {
  const m = currentModel(); if (!m || !state.works.length) return;
  m.works.push({ workId: state.works[0].id }); saveState(); render();
}
function updateModelWork(idx, field, val) {
  const m = currentModel(); if (!m) return;
  if (field === 'workId') { m.works[idx].workId = val; delete m.works[idx].customRate; }
  else { m.works[idx].customRate = parseFloat(val) || 0; }
  saveState(); render();
}
function removeModelWork(idx) {
  const m = currentModel(); if (!m) return;
  m.works.splice(idx, 1); saveState(); render();
}
function addModelMat() {
  const m = currentModel(); if (!m || !state.materials.length) return;
  m.materials.push({ matId: state.materials[0].id, qty: 1 }); saveState(); render();
}
function updateModelMat(idx, field, val) {
  const m = currentModel(); if (!m) return;
  m.materials[idx][field] = field === 'qty' ? (parseFloat(val) || 0) : val; saveState(); render();
}
function removeModelMat(idx) {
  const m = currentModel(); if (!m) return;
  m.materials.splice(idx, 1); saveState(); render();
}

function toggleQuick(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}
function quickAddYarn() {
  const name = document.getElementById('qaYarnName').value.trim();
  const price = parseFloat(document.getElementById('qaYarnPrice').value) || 0;
  const currency = document.getElementById('qaYarnCur').value;
  const weight = parseFloat(document.getElementById('qaYarnW').value) || 0.1;
  if (!name) return;
  const id = uid('y');
  state.yarns.push({ id, name, currency, price });
  currentModel().yarns.push({ yarnId: id, weight });
  saveState('Пряжа добавлена в базу и модель'); render();
}
function quickAddWork() {
  const name = document.getElementById('qaWorkName').value.trim();
  const rate = parseFloat(document.getElementById('qaWorkRate').value) || 0;
  const type = document.getElementById('qaWorkType').value;
  if (!name) return;
  const id = uid('w');
  state.works.push({ id, name, type, rate });
  currentModel().works.push({ workId: id });
  saveState('Операция добавлена в базу и модель'); render();
}
function quickAddMat() {
  const name = document.getElementById('qaMatName').value.trim();
  const price = parseFloat(document.getElementById('qaMatPrice').value) || 0;
  const unit = document.getElementById('qaMatUnit').value.trim() || 'шт';
  if (!name) return;
  const id = uid('mat');
  state.materials.push({ id, name, unit, price });
  currentModel().materials.push({ matId: id, qty: 1 });
  saveState('Материал добавлен в базу и модель'); render();
}

function createNewModel() {
  const id = uid('m');
  state.models.unshift({
    id, name: 'Новая модель', category: 'Шапки и балаклавы',
    knitTime: 6.5, fxRate: state.globalFx, defectPct: 3.0, includeIndirect: true, sellPrice: 0,
    yarns: state.yarns[0] ? [{ yarnId: state.yarns[0].id, weight: 0.12 }] : [],
    works: [], materials: []
  });
  selectedModelId = id;
  saveState('Создана новая модель'); render();
}
function duplicateModel(id) {
  const orig = state.models.find(x => x.id === id); if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = uid('m'); copy.name = orig.name + ' (копия)';
  state.models.unshift(copy); selectedModelId = copy.id;
  saveState('Модель продублирована'); render();
}
function deleteModel(id) {
  if (!confirm('Удалить эту модель?')) return;
  state.models = state.models.filter(x => x.id !== id);
  selectedModelId = state.models[0]?.id || null;
  saveState('Модель удалена'); render();
}
function deleteRef(key, idx) {
  if (!confirm('Удалить элемент из справочника?')) return;
  state[key].splice(idx, 1); saveState(); render();
}

// Export / Import / PIN
function exportCSV() {
  const header = ['Модель', 'Категория', 'Вес (кг)', 'Время (мин)', 'Пряжа+брак', 'Работы', 'Материалы', 'Прямые', 'Косвенные', 'Итого себестоимость'];
  const lines = [header.join(';')];
  state.models.forEach(m => {
    const c = calcModel(m);
    lines.push([
      '"' + m.name.replace(/"/g, '""') + '"',
      '"' + (m.category || '').replace(/"/g, '""') + '"',
      c.totalWeight.toFixed(3).replace('.', ','),
      String(m.knitTime).replace('.', ','),
      (c.yarnCost + c.defectCost).toFixed(2).replace('.', ','),
      c.worksCost.toFixed(2).replace('.', ','),
      c.matsCost.toFixed(2).replace('.', ','),
      c.direct.toFixed(2).replace('.', ','),
      (c.indirectFixed + c.indirectVar).toFixed(2).replace('.', ','),
      c.total.toFixed(2).replace('.', ',')
    ].join(';'));
  });
  downloadBlob('\uFEFF' + lines.join('\n'), 'sebestoimost_2025.csv', 'text/csv;charset=utf-8');
}
function exportJSON() {
  downloadBlob(JSON.stringify(state, null, 2), 'knitting_cost_backup.json', 'application/json');
}
function importJSON(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.models) throw new Error('Неверный формат');
      state = parsed; selectedModelId = state.models[0]?.id || null;
      saveState('База успешно загружена'); render();
    } catch (e) { alert('Ошибка чтения JSON: ' + e.message); }
  };
  reader.readAsText(file);
}
function downloadBlob(content, filename, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename; a.click();
}
function savePin() {
  state.pinCode = document.getElementById('newPinInput').value.trim();
  saveState(state.pinCode ? 'PIN-код сохранён' : 'PIN-код отключён');
}
function checkPin() {
  const val = document.getElementById('pinInput').value.trim();
  if (val === state.pinCode) {
    document.getElementById('pinOverlay').classList.remove('open');
    sessionStorage.setItem('pin_ok', '1');
    refreshDisk();
  } else {
    document.getElementById('pinErr').textContent = 'Неверный PIN-код';
  }
}
function resetAll() {
  if (!confirm('Сбросить все изменения и вернуть исходную таблицу 2025 года?')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  selectedModelId = state.models[0]?.id || null;
  saveState('Данные сброшены к базе 2025'); render();
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// PWA registration & install prompt
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-flex';
});
function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  });
}

// Init
receiveDiskLogin();
window.addEventListener('online', refreshDisk);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshDisk();
});
if (state.pinCode && !sessionStorage.getItem('pin_ok')) {
  document.getElementById('pinOverlay').classList.add('open');
}
render();
refreshDisk();
</script>
